[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-flow-analyzer"
version = "0.5"
description = "A learning-focused BLE flow analyzer"
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.1",
    "PySide6>=6.8",
    "PyYAML>=6.0",
    "winrt-Windows.Devices.Bluetooth>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
]

[project.scripts]
ble-flow-analyzer = "ble_flow_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ble_flow_analyzer = ["knowledge/*.yaml", "knowledge/images/*.svg", "knowledge/images/*.png", "knowledge/images/*.jpg"]
