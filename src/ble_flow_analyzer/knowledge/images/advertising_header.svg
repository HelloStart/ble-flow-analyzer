<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
  <rect width="900" height="190" fill="#ffffff"/>
  <text x="18" y="28" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#173f3b">Advertising Channel PDU Header · 16 bits</text>
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#17232b" stroke="#52636a" stroke-width="1.2">
    <rect x="18" y="48" width="210" height="64" fill="#63c4dd"/>
    <rect x="228" y="48" width="105" height="64" fill="#d8e9e4"/>
    <rect x="333" y="48" width="80" height="64" fill="#efbc3c"/>
    <rect x="413" y="48" width="80" height="64" fill="#f4d65e"/>
    <rect x="493" y="48" width="300" height="64" fill="#a9c6df"/>
    <rect x="793" y="48" width="89" height="64" fill="#d8e9e4"/>
    <text x="38" y="74" stroke="none">PDU Type</text><text x="38" y="98" stroke="none">bits 0-3 · ADV_IND = 0000</text>
    <text x="254" y="74" stroke="none">RFU</text><text x="250" y="98" stroke="none">2 bits</text>
    <text x="350" y="74" stroke="none">TxAdd</text><text x="358" y="98" stroke="none">1 bit</text>
    <text x="430" y="74" stroke="none">RxAdd</text><text x="438" y="98" stroke="none">1 bit</text>
    <text x="605" y="74" stroke="none">Length</text><text x="610" y="98" stroke="none">6 bits</text>
    <text x="810" y="74" stroke="none">RFU</text><text x="810" y="98" stroke="none">2 bits</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#52636a">
    <text x="18" y="140">Octet 0: PDU Type | RFU | TxAdd | RxAdd</text>
    <text x="18" y="164">Octet 1: Length bits 0-5 | RFU bits 6-7 (Legacy Advertising Channel PDU)</text>
  </g>
</svg>