<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270">
  <rect width="760" height="270" fill="#ffffff"/>
  <g font-family="Segoe UI, sans-serif" fill="#173f3b">
    <text x="18" y="28" font-size="18" font-weight="600">Connection parameter observation</text>
    <rect x="40" y="55" width="205" height="52" fill="#e7f2ef" stroke="#176f65"/><rect x="278" y="55" width="205" height="52" fill="#e7f2ef" stroke="#176f65"/><rect x="516" y="55" width="205" height="52" fill="#e7f2ef" stroke="#176f65"/>
    <text x="72" y="78" font-size="15">Connection Interval</text><text x="86" y="98" font-size="13">响应 / 吞吐 / 功耗</text>
    <text x="322" y="78" font-size="15">Peripheral Latency</text><text x="323" y="98" font-size="13">允许跳过连接事件</text>
    <text x="552" y="78" font-size="15">Supervision Timeout</text><text x="556" y="98" font-size="13">失联后的断开时间</text>
    <text x="90" y="165" font-size="15">Timeout &gt; 2 × (1 + Latency) × Interval</text>
    <line x1="90" y1="185" x2="670" y2="185" stroke="#176f65" stroke-width="2"/>
    <text x="90" y="220" font-size="14">WinRT reports resulting values; LL/L2CAP negotiation packets are not captured.</text>
  </g>
</svg>