<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" fill="#fff"/><g font-family="Segoe UI, sans-serif" fill="#173f3b"><text x="18" y="28" font-size="18" font-weight="600">CONNECTION_PARAMETERS_OBSERVED · current state snapshot</text><rect x="25" y="55" width="250" height="90" fill="#edf4f2" stroke="#176f65"/><text x="43" y="80" font-size="15" font-weight="600">Initial source may be</text><text x="43" y="105" font-size="14">CONNECT_IND / AUX_CONNECT_REQ</text><text x="43" y="129" font-size="13">Interval · Latency · Timeout</text><rect x="325" y="55" width="250" height="90" fill="#f8f4e8" stroke="#9a6a08"/><text x="343" y="80" font-size="15" font-weight="600">Or previously changed by</text><text x="343" y="105" font-size="14">LL Control / L2CAP procedures</text><text x="343" y="129" font-size="13">Update may predate observation</text><path d="M275 100h50m250 0h50" stroke="#52636a" stroke-width="2"/><polygon points="315,94 325,100 315,106" fill="#52636a"/><polygon points="615,94 625,100 615,106" fill="#52636a"/><rect x="625" y="55" width="250" height="90" fill="#e8eef4" stroke="#4f7980"/><text x="643" y="80" font-size="15" font-weight="600">WinRT snapshot now</text><text x="643" y="105" font-size="14">Connection Interval</text><text x="643" y="126" font-size="14">Latency · Supervision Timeout</text><text x="25" y="185" font-size="15" font-weight="600">OBSERVED means “read current effective values”. It does not prove an update occurred now.</text><text x="25" y="220" font-size="14">Values are actual WinRT results; the original or earlier LL PDU bytes remain unavailable.</text></g></svg>