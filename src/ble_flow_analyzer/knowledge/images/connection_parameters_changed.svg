<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect width="980" height="440" fill="#fff"/><g font-family="Segoe UI, sans-serif" fill="#17232b" stroke="#52636a"><text x="18" y="28" stroke="none" font-size="18" font-weight="600" fill="#173f3b">Connection parameter change · possible Link Layer structures</text><rect x="18" y="48" width="120" height="50" fill="#f4d65e"/><rect x="138" y="48" width="170" height="50" fill="#efbc3c"/><rect x="308" y="48" width="535" height="50" fill="#63c4dd"/><rect x="843" y="48" width="119" height="50" fill="#b9d58e"/><text x="34" y="78" stroke="none">Preamble</text><text x="154" y="78" stroke="none">Connection Access Address</text><text x="326" y="78" stroke="none">Data Physical Channel PDU</text><text x="862" y="78" stroke="none">CRC</text><path d="M575 98v22H185v20m390-20h260v20" fill="none"/><rect x="95" y="140" width="180" height="55" fill="#7acbe0"/><rect x="275" y="140" width="630" height="55" fill="#d8e9e4" stroke="#176f65" stroke-width="2"/><text x="115" y="173" stroke="none">Data Header · LLID=11</text><text x="295" y="173" stroke="none">LL Control PDU Payload = Opcode + CtrData</text><rect x="20" y="235" width="455" height="155" fill="#edf4f2" stroke="#176f65"/><text x="38" y="262" stroke="none" font-weight="600">Applied update: LL_CONNECTION_UPDATE_IND · Opcode 0x00</text><text x="38" y="290" stroke="none">Opcode 1 B | WinSize 1 B | WinOffset 2 B | Interval 2 B</text><text x="38" y="315" stroke="none">Latency 2 B | Timeout 2 B | Instant 2 B</text><text x="38" y="347" stroke="none">Central selects final values and the connection-event instant.</text><text x="38" y="372" stroke="none">This structure directly applies new Interval/Latency/Timeout.</text><rect x="505" y="235" width="455" height="155" fill="#f8f4e8" stroke="#9a6a08"/><text x="523" y="262" stroke="none" font-weight="600">Negotiation: LL_CONNECTION_PARAM_REQ/RSP · 0x0F / 0x10</text><text x="523" y="290" stroke="none">Interval Min 2 B | Interval Max 2 B | Latency 2 B | Timeout 2 B</text><text x="523" y="315" stroke="none">Preferred Periodicity 1 B | Reference Event Count 2 B</text><text x="523" y="340" stroke="none">Offset0..Offset5 · 12 B (REQ and RSP formats are identical)</text><text x="523" y="372" stroke="none">A final LL_CONNECTION_UPDATE_IND may follow to apply values.</text><text x="18" y="420" stroke="none" font-size="13" fill="#52636a">WinRT reports only the resulting changed values; it cannot identify which procedure or PDU sequence occurred.</text></g></svg>